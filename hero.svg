<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
  <defs>
    <radialGradient id="sph" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#1c2d57"/>
      <stop offset="0.55" stop-color="#0a1026"/>
      <stop offset="1" stop-color="#040614"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.32" cy="0.26" r="0.35">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="340" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="340" fill="#050913"/>

    <!-- star field -->
    <g fill="#c9d4e3">
      <circle cx="612" cy="38" r="0.9" opacity="0.5"/><circle cx="668" cy="292" r="0.8" opacity="0.4"/>
      <circle cx="944" cy="64" r="1" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="962" cy="250" r="0.8" opacity="0.4"/><circle cx="598" cy="210" r="0.7" opacity="0.35"/>
      <circle cx="880" cy="22" r="0.8" opacity="0.45"/><circle cx="712" cy="20" r="0.7" opacity="0.4"/>
      <circle cx="636" cy="128" r="1" opacity="0.5"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="928" cy="312" r="0.9" opacity="0.4"/><circle cx="980" cy="160" r="0.8" opacity="0.4"/>
      <circle cx="430" cy="30" r="0.7" opacity="0.3"/><circle cx="500" cy="318" r="0.7" opacity="0.3"/>
    </g>

    <!-- left panel -->
    <text x="52" y="66" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="3" fill="#38bdf8">── COMPUTING × FLIGHT · 2026</text>
    <text x="50" y="118" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="44" fill="#eef2f8">Jayan Tasnim</text>
    <text x="52" y="146" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="2.6" fill="#7dd3fc">MACHINE LEARNING · EMBEDDED · AEROSPACE</text>

    <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#94a3b8">
      <text x="52" y="186">Software that can be trusted with things that fly.</text>
      <text x="52" y="206">Models that know when they are unsure, embedded</text>
      <text x="52" y="226">systems that react in real time.</text>
    </g>

    <line x1="52" y1="248" x2="520" y2="248" stroke="#1e293b"/>

    <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11">
      <text x="52" y="272" fill="#64748b" letter-spacing="1.5">FLIGHT</text>
      <text x="150" y="272" fill="#cbd5e1">aero surrogates · uav safety · lunar planning</text>
      <text x="52" y="292" fill="#64748b" letter-spacing="1.5">LEARNING</text>
      <text x="150" y="292" fill="#cbd5e1">pytorch · gaussian process · xai</text>
      <text x="52" y="312" fill="#64748b" letter-spacing="1.5">SYSTEMS</text>
      <text x="150" y="312" fill="#cbd5e1">stm32 · embedded c · esp32</text>
    </g>

    <line x1="580" y1="44" x2="580" y2="296" stroke="#1e293b"/>

    <!-- sphere -->
    <g transform="translate(790 172)">
      <circle r="168" fill="url(#halo)"/>
      <circle r="118" fill="url(#sph)"/>
      <circle r="118" fill="url(#shine)"/>

      <g fill="none" stroke="#38bdf8" stroke-width="1">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
        <ellipse rx="118" ry="42" stroke-opacity="0.32"/>
        <ellipse rx="118" ry="42" transform="rotate(60)" stroke-opacity="0.26"/>
        <ellipse rx="118" ry="42" transform="rotate(120)" stroke-opacity="0.26"/>
        <ellipse rx="40" ry="118" stroke-opacity="0.18"/>
      </g>
      <circle r="118" fill="none" stroke="#7dd3fc" stroke-opacity="0.35"/>

      <!-- satellite orbit -->
      <g transform="rotate(-16)">
        <ellipse rx="176" ry="46" fill="none" stroke="#f2a65a" stroke-opacity="0.35" stroke-dasharray="2 6"/>
        <circle r="7" fill="#f2a65a" fill-opacity="0.18">
          <animateMotion dur="10s" repeatCount="indefinite" path="M-176,0 a176,46 0 1,0 352,0 a176,46 0 1,0 -352,0"/>
        </circle>
        <circle r="2.8" fill="#f2a65a">
          <animateMotion dur="10s" repeatCount="indefinite" path="M-176,0 a176,46 0 1,0 352,0 a176,46 0 1,0 -352,0"/>
        </circle>
      </g>

      <!-- core -->
      <circle r="16" fill="url(#core)"><animate attributeName="r" values="12;20;12" dur="3s" repeatCount="indefinite"/></circle>
      <circle r="3.6" fill="#fef3c7"/>

      <!-- tokens -->
      <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#7dd3fc">
        <circle cx="-62" cy="-66" r="2.2" fill="#38bdf8"/><text x="-54" y="-62">naca 0012</text>
        <circle cx="38" cy="-86" r="2.2" fill="#38bdf8"/><text x="46" y="-82">pytorch</text>
        <circle cx="-96" cy="-6" r="2.2" fill="#38bdf8"/><text x="-88" y="-2">simulink</text>
        <circle cx="60" cy="-26" r="2.2" fill="#38bdf8"/><text x="68" y="-22">uav</text>
        <circle cx="-50" cy="54" r="2.2" fill="#38bdf8"/><text x="-42" y="58">stm32</text>
        <circle cx="34" cy="40" r="2.2" fill="#38bdf8"/><text x="42" y="44">xai</text>
        <circle cx="-6" cy="88" r="2.2" fill="#f2a65a"/><text x="2" y="92" fill="#f2a65a" font-style="italic">// lunar</text>
      </g>
    </g>

    <text x="948" y="318" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" letter-spacing="1.6" fill="#475569">↳ ORBIT T = 28s · 23.81°N 90.41°E</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="339" rx="14" fill="none" stroke="#111827"/>
</svg>
